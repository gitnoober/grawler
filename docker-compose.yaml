
version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: grawler
      POSTGRES_PASSWORD: grawlerpass
      POSTGRES_DB: grawlerdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: grawler
      DB_PASSWORD: grawlerpass
      DB_NAME: grawlerdb
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data: